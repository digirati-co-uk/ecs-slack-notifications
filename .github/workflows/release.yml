name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build zip
        id: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash ./build_zip.sh "$version"
          echo "zip=ecs-slack-notifications-$version.zip" >> "$GITHUB_OUTPUT"

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --clobber
